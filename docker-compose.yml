services:
  postgres:
    image: postgres:16-alpine
    container_name: BANDLIK-AGENTLIGI
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bandlik_monitoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bandlik_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bandlik_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bandlik_backend
    restart: always
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bandlik_monitoring}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_bandlik_monitoring_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bandlik_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bandlik_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bandlik_network

volumes:
  postgres_data:
    driver: local

networks:
  bandlik_network:
    driver: bridge
