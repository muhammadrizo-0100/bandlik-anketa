name: Deploy Bandlik to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandlik-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: node scripts/lint-changed.mjs
        env:
          BASE_REVISION: ${{ github.event.before }}
      - run: npm test -- --runInBand --runTestsByPath src/config/database.config.spec.ts src/database/seed.service.spec.ts
        working-directory: backend
        env:
          NODE_OPTIONS: --experimental-vm-modules
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: bash -n deploy.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure project deployment key
        id: check_keys
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS secrets not configured. Skipping VPS deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '[%s]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKOijH6B/fXduCTUuumy/vapPQ1t7kFhzEi4zhy8PyVK\n' "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Deploy main
        if: steps.check_keys.outputs.skip != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ssh -o BatchMode=yes -p 2222 deploy@"$VPS_HOST" bandlik-production
